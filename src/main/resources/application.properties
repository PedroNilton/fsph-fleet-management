spring.application.name=fsph-fleet-management

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.reporting.time-zone=${REPORTING_TIME_ZONE:America/Sao_Paulo}

app.admin.name=${ADMIN_NAME}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.sector-name=${ADMIN_SECTOR_NAME:Administrativo}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:PT1H}
app.jwt.issuer=${JWT_ISSUER:fsph-fleet-management}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.notifications.email.enabled=${MAIL_NOTIFICATIONS_ENABLED:false}
app.notifications.email.from=${MAIL_FROM:no-reply@fsph.se.gov.br}
app.notifications.email.host=${MAIL_HOST:}
app.notifications.email.port=${MAIL_PORT:587}
app.notifications.email.username=${MAIL_USERNAME:}
app.notifications.email.password=${MAIL_PASSWORD:}
app.notifications.email.smtp-auth=${MAIL_SMTP_AUTH:true}
app.notifications.email.start-tls=${MAIL_SMTP_STARTTLS:true}
